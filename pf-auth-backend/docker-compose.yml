services:
  pf-auth-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pf-auth-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    volumes:
    - ./uploads:/app/uploads
    depends_on:
      - postgres 
    networks:
      - pf-shared-network  # Changed from backend-network

  pf-auth-nginx:
    image: nginx:alpine
    container_name: pf-auth-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pf-auth-backend
    networks:
      - pf-shared-network  # Changed from backend-network

  postgres:   
    image: tensorchord/pgvecto-rs:pg16-v0.3.0
    container_name: pf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pf
      POSTGRES_PASSWORD: pf
      POSTGRES_DB: pf
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - pf-shared-network

networks:
  pf-shared-network:
    driver: bridge
    name: pf-shared-network  # Explicit name so frontend can use 